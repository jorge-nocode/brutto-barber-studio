<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mrs+Saint+Delafield&family=Pinyon+Script&family=Tangerine:wght@400;700&family=Alex+Brush&family=WindSong&family=Mr+De+Haviland&family=Berkshire+Swash&display=swap" rel="stylesheet">
<style>
  body { margin:0; background:#0d0805; }
  .row { display:flex; align-items:center; gap:32px; padding:28px 48px; border-bottom:1px solid #2a2015; }
  .row .label { width:180px; flex:none; font-family: system-ui; color:#9b332b; font-size:14px; letter-spacing:.08em; text-transform:uppercase; }
  .row .sample { color:#f2e8d5; white-space:nowrap; }
  .f1 { font-family:'Mrs Saint Delafield'; font-size:58px; }
  .f2 { font-family:'Pinyon Script'; font-size:66px; }
  .f3 { font-family:'Tangerine'; font-size:78px; font-weight:700; }
  .f4 { font-family:'Alex Brush'; font-size:56px; }
  .f5 { font-family:'WindSong'; font-size:52px; }
  .f6 { font-family:'Mr De Haviland'; font-size:52px; }
  .f7 { font-family:'Berkshire Swash'; font-size:42px; }
</style>
</head>
<body>
  <div class="row"><div class="label">Mrs Saint Delafield (atual)</div><div class="sample f1">Brutalmente bem-feito.</div></div>
  <div class="row"><div class="label">Pinyon Script</div><div class="sample f2">Brutalmente bem-feito.</div></div>
  <div class="row"><div class="label">Tangerine 700</div><div class="sample f3">Brutalmente bem-feito.</div></div>
  <div class="row"><div class="label">Alex Brush</div><div class="sample f4">Brutalmente bem-feito.</div></div>
  <div class="row"><div class="label">WindSong</div><div class="sample f5">Brutalmente bem-feito.</div></div>
  <div class="row"><div class="label">Mr De Haviland</div><div class="sample f6">Brutalmente bem-feito.</div></div>
  <div class="row"><div class="label">Berkshire Swash</div><div class="sample f7">Brutalmente bem-feito.</div></div>
</body>
</html>
